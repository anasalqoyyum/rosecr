[project]
name = "rosecr-ocr"
version = "0.0.1"
description = "Rosecr OCR sidecar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "numpy==2.5.4",
  "pillow==13.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
